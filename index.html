<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun Nana!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d81b60;
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Cake Styling */
        .cake-container {
            position: relative;
            margin-top: 50px;
            cursor: pointer;
        }

        .cake {
            position: relative;
            width: 250px;
            height: 150px;
            background: #f48fb1;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .cake::before {
            content: "";
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: 40px;
            background: #f06292;
        }

        .cake::after {
            content: "";
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            height: 40px;
            background: #ec407a;
        }

        .plate {
            width: 300px;
            height: 15px;
            background: #ccc;
            border-radius: 10px;
            margin-top: -5px;
        }

        .candles {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .candle {
            width: 15px;
            height: 50px;
            background: linear-gradient(to bottom, #fff 0%, #eee 100%);
            border-radius: 5px;
            position: relative;
        }

        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 25px;
            background: #ffeb3b;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ffeb3b;
            animation: flicker 0.5s infinite alternate;
            transition: opacity 0.5s;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        .flame.out {
            opacity: 0;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f00;
            top: -10px;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Message */
        #message {
            margin-top: 30px;
            font-size: 1.5rem;
            color: #ad1457;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s;
        }

        #message.show {
            opacity: 1;
        }

        .duck-nana {
            font-size: 50px;
            margin-top: 20px;
            display: inline-block;
        }

        .party-hat {
            position: relative;
            display: inline-block;
        }

        .party-hat::before {
            content: "▲";
            position: absolute;
            top: -25px;
            left: 10px;
            color: #ff4081;
            font-size: 30px;
            transform: rotate(-10deg);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Selamat Ulang Tahun, Nana! 🎂</h1>

    <div class="cake-container" onclick="blowOut()">
        <div class="candles">
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
        </div>
        <div class="cake"></div>
        <div class="plate"></div>
    </div>

    <div id="message">Semoga hari ini penuh dengan kebahagiaan dan keceriaan! Kwek! 🦆✨</div>

    <div class="party-hat">
        <div class="duck-nana">🦆</div>
    </div>
</div>

<script>
    function blowOut() {
        const flames = document.querySelectorAll('.flame');
        flames.forEach(flame => flame.classList.add('out'));
        document.getElementById('message').classList.add('show');
        createConfetti();
    }

    function createConfetti() {
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];
        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.opacity = Math.random();
            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }
    }
</script>

</body>
</html>
